[package]
name = "wdsjqdq"
version = "0.1.0"
edition = "2024"
description = "A Minecraft-inspired desktop launcher UI"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "system_fonts"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
serde_json = "1"
sha1_smol = "1"
ureq = { version = "2.12", default-features = false, features = ["gzip", "tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
